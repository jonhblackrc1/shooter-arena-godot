name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: Export Android (debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bring Godot templates + editor settings into this job's HOME
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/" 2>/dev/null || true
          cp -r /root/.config/godot/* "$HOME/.config/godot/" 2>/dev/null || true
          echo "--- env ---"; echo "HOME=$HOME"; echo "JAVA_HOME=$JAVA_HOME"; echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- jvm dirs ---"; ls -d /usr/lib/jvm/* 2>/dev/null || true
          echo "--- image editor settings android/java keys ---"; grep -iE "java_sdk|android_sdk|debug_keystore" /root/.config/godot/editor_settings-4.tres 2>/dev/null || echo "NONE in image config"
          echo "--- templates ---"; ls -la "$HOME/.local/share/godot/export_templates/" || true

      - name: Generate Android debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/shooter-arena.apk
          ls -la build/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shooter-arena-android
          path: build/shooter-arena.apk

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-latest
          name: "Shooter Arena (Godot) — build de prueba"
          body: "APK del prototipo Godot, compilado automaticamente. Instalacion directa (fuera de Play Store)."
          files: build/shooter-arena.apk
