name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  android:
    name: Export Android (debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching Android SDK components (build-tools 34 + platform 34)
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/tools/bin/sdkmanager; do
              [ -x "$c" ] && SDKMGR="$c" && break
            done
          fi
          echo "sdkmanager => ${SDKMGR:-NOT FOUND}"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true
          fi
          echo "--- build-tools present ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo none
          echo "--- platforms present ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || echo none

      - name: Generate Android debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Configure Godot (export templates + Android SDK + JDK + keystore)
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/" 2>/dev/null || true
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # heredoc above is indented; strip the leading spaces so the .tres is valid
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.tres"
          echo "--- editor_settings-4.tres ---"; cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Install Android build template (Gradle)
        run: |
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          echo "template: $TPL"; ls -la "$TPL"
          mkdir -p android/build
          unzip -o -q "$TPL" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          echo "--- android/build ---"; ls android/build | head

      - name: Export signed debug APK (Gradle build)
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/shooter-arena.apk
          echo "--- build dir ---"; ls -la build/
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${BT}apksigner" verify --verbose build/shooter-arena.apk || echo "(verify skipped)"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shooter-arena-android
          path: build/shooter-arena.apk

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-latest
          name: "Shooter Arena (Godot) — build de prueba"
          body: "APK del prototipo Godot, compilado automaticamente. Instalacion directa (fuera de Play Store)."
          files: build/shooter-arena.apk
